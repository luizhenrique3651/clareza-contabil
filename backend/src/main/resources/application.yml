spring:
  application:
    name: mourao-clareza-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clarity_mvp}
    username: ${DATABASE_USER:clarity_owner}
    password: ${DATABASE_PASSWORD:clarity_local_dev_only}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      auto-commit: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

clareza:
  financial:
    time-zone: ${CLAREZA_FINANCIAL_TIME_ZONE:America/Manaus}
  security:
    allow-header-identity-fallback: ${CLAREZA_ALLOW_HEADER_IDENTITY:true}
    default-provider: ${CLAREZA_AUTH_PROVIDER:sites-siwc}

server:
  port: ${PORT:8080}
