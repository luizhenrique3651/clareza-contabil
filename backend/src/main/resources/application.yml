spring:
  application:
    name: clareza-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clareza}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      auto-commit: false
      maximum-pool-size: 20
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

clareza:
  timezone: America/Manaus
  security:
    allow-header-identity-fallback: ${ALLOW_HEADER_IDENTITY_FALLBACK:false}
    allow-test-email-header: ${ALLOW_TEST_EMAIL_HEADER:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
